# DataFlow Taskfile
# Run with: task <command>

version: '3'

tasks:
  # Container commands
  build:
    desc: "Build container images for API and UI"
    cmds:
      - podman build -f Containerfile.api -t dataflow-api .
      - podman build -f Containerfile.ui -t dataflow-ui .
      - echo "Container images built successfully!"

  up:
    desc: "Start DataFlow with Podman Compose"
    cmds:
      - |
        if ! podman system connection list >/dev/null 2>&1; then
          echo "Initializing Podman machine..."
          podman machine init
          podman machine start
        fi
      - podman-compose up -d
      - echo "DataFlow started!"
      - echo "API at http://localhost:8000/docs"
      - echo "UI at http://localhost:8501"

  down:
    desc: "Stop DataFlow services"
    cmds:
      - podman-compose down
      - echo "DataFlow services stopped"

  logs:
    desc: "View service logs"
    cmds:
      - podman-compose logs -f

  restart:
    desc: "Restart services"
    cmds:
      - podman-compose restart
      - echo "Services restarted"

  kill-local:
    desc: "Kill any local DataFlow processes"
    cmds:
      - |
        echo "Killing local DataFlow processes..."
        pkill -f "streamlit.*dataflow" || true
        pkill -f "uvicorn.*dataflow" || true
        pkill -f "start.py.*api" || true
        pkill -f "start.py.*ui" || true
        echo "Local processes cleaned up"

  clean:
    desc: "Clean up container resources"
    cmds:
      - podman-compose down -v
      - podman system prune -f
      - echo "Container resources cleaned"

  help:
    desc: "Show available tasks"
    cmds:
      - echo "DataFlow Task Commands"
      - echo "======================"
      - echo ""
      - echo "Container Commands"
      - echo "  task build      - Build container images"
      - echo "  task up          - Start DataFlow services"
      - echo "  task down        - Stop DataFlow services"
      - echo "  task logs        - View service logs"
      - echo "  task restart     - Restart services"
      - echo "  task kill-local   - Kill local DataFlow processes"
      - echo "  task clean       - Clean container resources"
      - echo ""
      - echo "Utilities"
      - echo "  task help        - Show this help"