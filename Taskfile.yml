# DataFlow Taskfile
# Run with: task <command>

version: '3'

vars:
  JAVA_HOME: "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
  JAVA_BIN: "/opt/homebrew/opt/openjdk@17/bin"

tasks:
  setup:
    desc: "Initial setup for DataFlow"
    cmds:
      - python setup.py
      - echo "Setup complete! Edit .env file and set your OPENAI_API_KEY"

  install:
    desc: "Install dependencies with uv"
    cmds:
      - uv sync
      - echo "Dependencies installed!"

  check-java:
    desc: "Check if Java 17 is installed and active"
    cmds:
      - |
        if [ ! -d "{{.JAVA_HOME}}" ]; then
          echo "Java 17 not found. Installing..."
          brew install openjdk@17
        fi
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - java -version
      - echo "Java 17 is ready!"

  example:
    desc: "Run the MVP example (recommended first run)"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run python mvp_example.py

  ui:
    desc: "Start the web UI"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - echo "Starting DataFlow Web UI..."
      - echo "Open http://localhost:8501 in your browser"
      - uv run python start.py ui

  api:
    desc: "Start the API server"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - echo "Starting DataFlow API server..."
      - echo "API docs at http://localhost:8000/docs"
      - uv run python start.py api

  cli-help:
    desc: "Show CLI help"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run dataflow --help

  dataset-list:
    desc: "List all datasets"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run dataflow dataset list

  dataset-show:
    desc: "Show dataset details"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run dataflow dataset show {{.CLI_ARGS}}

  job-list:
    desc: "List all transformation jobs"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run dataflow job list

  transform:
    desc: "Transform data"
    deps: [check-java]
    cmds:
      - export JAVA_HOME="{{.JAVA_HOME}}"
      - export PATH="{{.JAVA_BIN}}:$PATH"
      - uv run dataflow transform {{.CLI_ARGS}}

  test:
    desc: "Run tests"
    cmds:
      - uv run pytest

  lint:
    desc: "Run linting"
    cmds:
      - uv run hatch run lint

  format:
    desc: "Format code"
    cmds:
      - uv run hatch run format

  clean:
    desc: "Clean up temporary files"
    cmds:
      - rm -rf __pycache__/
      - rm -rf .pytest_cache/
      - rm -rf *.log
      - rm -rf dataflow_datasets/
      - rm -rf exported_datasets.json
      - echo "Cleaned up temporary files"

  status:
    desc: "Check DataFlow status"
    cmds:
      - echo "Checking DataFlow status..."
      - |
        if [ -f ".env" ]; then
          echo ".env file exists"
        else
          echo ".env file missing - run task setup"
        fi
      - |
        if [ -d ".venv" ] || command -v uv >/dev/null 2>&1; then
          echo "Dependencies installed"
        else
          echo "Dependencies not installed - run task install"
        fi
      - |
        if [ -d "{{.JAVA_HOME}}" ]; then
          echo "Java 17 installed"
        else
          echo "Java 17 not installed - run task check-java"
        fi

  # Container commands
  build:
    desc: "Build container images for API and UI"
    cmds:
      - podman build -f Containerfile.api -t dataflow-api .
      - podman build -f Containerfile.ui -t dataflow-ui .
      - echo "Container images built successfully!"

  up:
    desc: "Start DataFlow with Podman Compose"
    cmds:
      - |
        if ! podman system connection list >/dev/null 2>&1; then
          echo "Initializing Podman machine..."
          podman machine init
          podman machine start
        fi
      - podman-compose up -d
      - echo "DataFlow started!"
      - echo "API at http://localhost:8000/docs"
      - echo "UI at http://localhost:8501"

  down:
    desc: "Stop DataFlow services"
    cmds:
      - podman-compose down
      - echo "DataFlow services stopped"

  logs:
    desc: "View service logs"
    cmds:
      - podman-compose logs -f

  restart:
    desc: "Restart services"
    cmds:
      - podman-compose restart
      - echo "Services restarted"

  kill-local:
    desc: "Kill any local DataFlow processes"
    cmds:
      - |
        echo "Killing local DataFlow processes..."
        pkill -f "streamlit.*dataflow" || true
        pkill -f "uvicorn.*dataflow" || true
        pkill -f "start.py.*api" || true
        pkill -f "start.py.*ui" || true
        echo "Local processes cleaned up"

  clean:
    desc: "Clean up container resources"
    cmds:
      - podman-compose down -v
      - podman system prune -f
      - echo "Container resources cleaned"

  help:
    desc: "Show available tasks"
    cmds:
      - echo "DataFlow Task Commands"
      - echo "======================"
      - echo ""
      - echo "Setup Commands"
      - echo "  task setup      - Initial setup (creates .env file)"
      - echo "  task install    - Install dependencies"
      - echo "  task check-java - Check/install Java 17"
      - echo ""
      - echo "Main Commands"
      - echo "  task example    - Run MVP example (recommended first run)"
      - echo "  task ui         - Start web UI"
      - echo "  task api        - Start API server"
      - echo ""
      - echo "CLI Commands"
      - echo "  task cli-help      - Show CLI help"
      - echo "  task dataset-list  - List datasets"
      - echo "  task dataset-show  - Show dataset"
      - echo "  task job-list      - List transformation jobs"
      - echo "  task transform     - Transform data"
      - echo ""
      - echo "Container Commands"
      - echo "  task build      - Build container images"
      - echo "  task up          - Start DataFlow services"
      - echo "  task down        - Stop DataFlow services"
      - echo "  task logs        - View service logs"
      - echo "  task restart     - Restart services"
      - echo "  task clean       - Clean container resources"
      - echo "  task kill-local   - Kill local DataFlow processes"
      - echo ""
      - echo "Development"
      - echo "  task test      - Run tests"
      - echo "  task lint      - Run linting"
      - echo "  task format    - Format code"
      - echo ""
      - echo "Utilities"
      - echo "  task clean     - Clean temporary files"
      - echo "  task status    - Check DataFlow status"
      - echo "  task help      - Show this help"

default: help